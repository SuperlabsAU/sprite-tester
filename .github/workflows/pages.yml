name: Deploy sprite comparison to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/dist/**'
      - 'site/tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify playback
        run: node --test site/tests/playback.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
